# Render Blueprint: creates the web app and a PostgreSQL database in one go
services:
  - type: web
    name: taskflow
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
databases:
  - name: taskflow-db
    plan: free
